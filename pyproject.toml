[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personaos"
version = "0.1.0"
description = "Persona 3 Reload inspired Linux productivity dashboard"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "PySide6>=6.8",
    "psutil",
    "requests",
    "docker",
    "fastapi",
    "uvicorn",
    "Pillow",
    "pyqtgraph",
    "watchdog",
    "rich",
    "GitPython"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "mypy>=2.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]
